# lingo-agent services. Default `docker compose up` starts only what the app needs;
# optional services live behind profiles (e.g. `--profile observability`).
#
# Settings come from `.env` (see .env.example; `make env` creates one). Addresses
# between containers (database, backend, trace collector) are fixed here, so the
# localhost URLs in .env stay valid for running the backend on the host.
#
# Only the frontend is published on all interfaces; everything else binds to
# 127.0.0.1 so a server doesn't expose its database or API by accident.
name: lingo-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingo}
      POSTGRES_DB: ${POSTGRES_DB:-lingo}
    ports:
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped

  # Runs migrations on start, then serves the API (backend/Dockerfile).
  # Refuses to start without CREDENTIALS_ENCRYPTION_KEYS; `make env` generates one.
  backend:
    build: ./backend
    image: lingo-agent-backend
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PROVIDERS_CONFIG: ${PROVIDERS_CONFIG:-config/providers.dev.yaml}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lingo}:${POSTGRES_PASSWORD:-lingo}@postgres:5432/${POSTGRES_DB:-lingo}
      CHECKPOINT_POOL_MAX_SIZE: ${CHECKPOINT_POOL_MAX_SIZE:-4}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CREDENTIALS_ENCRYPTION_KEYS: ${CREDENTIALS_ENCRYPTION_KEYS:-}
      PROVIDER_ALLOW_PRIVATE_NETWORKS: ${PROVIDER_ALLOW_PRIVATE_NETWORKS:-false}
      MEMORY_REFLECTION_ENABLED: ${MEMORY_REFLECTION_ENABLED:-true}
      # Scheduled jobs run inside this process (ADR 0025): keep one backend replica
      # with one uvicorn worker, or every copy runs every job.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Proxy for fetching RSS feeds only (Q41h); empty = direct.
      FEED_HTTP_PROXY: ${COMPOSE_FEED_HTTP_PROXY:-}
      # Address of the `asr` service below as seen from this container (speaches preset).
      SPEACHES_BASE_URL: http://asr:8000/v1
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    extra_hosts:
      # Lets tenants reach a model server on the host (e.g. Ollama) via
      # http://host.docker.internal:11434/v1 (needs PROVIDER_ALLOW_PRIVATE_NETWORKS=true).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the /api rewrites at build time (frontend/Dockerfile).
        BACKEND_URL: http://backend:8000
    image: lingo-agent-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  # Local trace viewer for OpenTelemetry (ADR 0005). Dev-only, opt-in.
  # UI: http://localhost:6006  OTLP/HTTP: http://localhost:6006/v1/traces
  # Phoenix server is ELv2-licensed; it runs as a separate container and is not
  # a dependency of this project's code.
  phoenix:
    image: arizephoenix/phoenix:version-20.16.0
    profiles: [observability]
    ports:
      # Traces carry full conversation content: never expose beyond localhost.
      - "127.0.0.1:6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    mem_limit: 1g
    restart: unless-stopped

  # Reserved for later caching / rate limiting; no code uses it yet.
  redis:
    image: redis:8-alpine
    profiles: [redis]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 128m
    restart: unless-stopped

  # Local speech-to-text for dev (ADR 0008 §5): an OpenAI-compatible /audio/transcriptions
  # server (faster-whisper). Add it in Settings as a connection from the `speaches` preset
  # (its base URL is http://localhost:8200/v1 for a backend on the host and, through
  # SPEACHES_BASE_URL, http://asr:8000/v1 for the compose backend) and put it on the
  # speech-to-text route. The image is ~3.4GB, so
  # it stays behind a profile; prod uses a hosted API instead.
  asr:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: [asr]
    ports:
      - "127.0.0.1:${ASR_HOST_PORT:-8200}:8000"
    environment:
      # Downloaded on first start into the volume below (startup fails if it can't be).
      PRELOAD_MODELS: '["${ASR_MODEL:-Systran/faster-whisper-small}"]'
      # Where models come from; set ASR_HF_ENDPOINT=https://hf-mirror.com where
      # huggingface.co is unreachable (the container doesn't use the host's proxy).
      HF_ENDPOINT: ${ASR_HF_ENDPOINT:-https://huggingface.co}
      WHISPER__COMPUTE_TYPE: int8
      # Unload the model after 5 idle minutes; the next request loads it again (~seconds).
      STT_MODEL_TTL: "300"
    volumes:
      - asr-models:/home/ubuntu/.cache/huggingface/hub
    mem_limit: 2g
    restart: unless-stopped

volumes:
  pgdata:
  phoenix-data:
  redis-data:
  asr-models:
