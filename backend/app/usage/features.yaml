# Which model calls each learner-facing feature makes (ADR 0014). The frontend's AI
# badge shows these, with token estimates from the tenant's own recent calls
# (`llm_usage`), or the `default` numbers here until there is history.
#
# Adding a feature that calls a model? Register it here and put an AI badge on it.
#
# Per call:
#   task     the `llm_usage.task` label its history is recorded under
#   section  provider section (llm / embedding / asr / tts); default llm
#   route    the route task it runs on, when not the same as `task`
#   timing   now: the learner waits for it; background: after the reply, off the
#            request path. Work nobody waits for (scheduled jobs, generating ahead)
#            also passes `background: True` in the run metadata, so it counts against
#            the tenant's daily background budget (ADR 0025 §5), and gets a learner
#            switch in app/scheduler/prefs.py
#   per      what one call covers: call / image / page (scanned PDF pages only)
#   default  estimate without history: input/output tokens, audio_seconds for asr,
#            characters for tts
#   history  false when the call is never recorded in llm_usage (embeddings)

# Successful calls averaged per task.
window: 20

features:
  chat_message:
    calls:
      - task: chat
        timing: now
        default: {input_tokens: 5400, output_tokens: 150}
      # Only when the tutor used a tool: its reply after the tool results (ADR 0015 §7).
      - task: chat_tools
        route: chat
        timing: now
        default: {input_tokens: 3000, output_tokens: 150}
      # Only in free chat, for a message of 60+ English words (Q38a): is it a piece of
      # writing for writing_coach? The reply waits for it (ADR 0023 §3).
      - task: route
        timing: now
        default: {input_tokens: 500, output_tokens: 15}
      # Only when route handed the message to writing_coach: the same review as
      # /writing (Q38b); the coach's reply after it is the chat call above.
      - task: writing_review
        timing: now
        default: {input_tokens: 6100, output_tokens: 500}
      # Reflection after each reply: memory, grammar tags, words; every few turns it
      # also rewrites the conversation summary.
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}

  chat_image:
    calls:
      - task: vision
        timing: now
        per: image
        default: {input_tokens: 1500, output_tokens: 200}

  chat_pdf:
    calls:
      - task: vision
        timing: now
        per: page
        default: {input_tokens: 1500, output_tokens: 600}

  chat_audio:
    calls:
      - task: asr
        section: asr
        timing: now
        default: {audio_seconds: 15}

  # Server read-aloud, one sentence per call; repeats come from the cache and cost
  # nothing (ADR 0028 §3). Without a tts route the browser reads aloud: no call, no badge.
  read_aloud:
    calls:
      - task: tts
        section: tts
        route: default
        timing: now
        default: {characters: 60}

  practice_start:
    calls:
      - task: practice_opening
        route: chat
        timing: now
        default: {input_tokens: 1500, output_tokens: 150}

  # A practice set (ADR 0021 §3): one call writes the set's items, one reviews them;
  # items the critic rejects are rewritten and reviewed again, at most
  # practice.max_regenerations more rounds (fewer items each). After a set is done,
  # the next one is written the same way in the background (Q33e).
  practice_set:
    calls:
      - task: exercise_generate
        timing: now
        default: {input_tokens: 6800, output_tokens: 1500}
      - task: exercise_critic
        timing: now
        default: {input_tokens: 5900, output_tokens: 1000}
      - task: exercise_generate
        timing: background
        default: {input_tokens: 6800, output_tokens: 1500}
      - task: exercise_critic
        timing: background
        default: {input_tokens: 5900, output_tokens: 1000}

  # Grading an answer the code cannot (ADR 0021 §6): open formats, and find_fix with a
  # fix not in the item's list. One call per such answer, only the first time an item
  # is answered (Q34b); choice and cloze answers are graded by code. Most of the input
  # is the grammar catalog, the same on every call.
  practice_grade:
    calls:
      - task: exercise_grade
        timing: now
        default: {input_tokens: 11900, output_tokens: 150}

  # Opening an article on /reading (ADR 0024 §5, Q42f): when no version at the
  # learner's level is cached for the tenant, one call rewrites it and writes the
  # comprehension questions, one reviews the questions (on the exercise_critic route);
  # rejected questions are rewritten and reviewed once more (fewer each). A cached
  # version makes no call.
  reading_rewrite:
    calls:
      - task: article_rewrite
        timing: now
        default: {input_tokens: 6000, output_tokens: 1100}
      - task: reading_critic
        route: exercise_critic
        timing: now
        default: {input_tokens: 5400, output_tokens: 350}
      - task: reading_questions
        route: article_rewrite
        timing: now
        default: {input_tokens: 5400, output_tokens: 300}

  # "Ask the tutor" on the reading page (Q43h): reading_coach answers each message with
  # the article in its prompt (Q43i), so a reply reads more than a chat turn does.
  reading_coach:
    calls:
      - task: reading_coach
        route: chat
        timing: now
        default: {input_tokens: 4500, output_tokens: 300}
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}

  # Rewriting new articles ahead of time (Q42g): every 2 hours, the newest articles
  # of the feeds a learner follows are rewritten for their level, the same calls as
  # reading_rewrite, within the tenant's daily background budget.
  reading_prerewrite:
    calls:
      - task: article_rewrite
        timing: background
        default: {input_tokens: 6000, output_tokens: 1100}
      - task: reading_critic
        route: exercise_critic
        timing: background
        default: {input_tokens: 5400, output_tokens: 350}
      - task: reading_questions
        route: article_rewrite
        timing: background
        default: {input_tokens: 5400, output_tokens: 300}

  # "Submit" on /writing (P2 plan §4.2): one review of the whole text, run in the
  # background while the page waits for it (Q38c).
  writing_submit:
    calls:
      - task: writing_review
        timing: now
        default: {input_tokens: 6100, output_tokens: 500}

  # "Talk it over with the tutor" in the placement result's conversation (ADR 0015 §6,
  # 0016 §4): the tutor's opening of the planning conversation; later turns, and the
  # dashboard's daily conversation (which has no opening), are chat_message.
  plan_start:
    calls:
      - task: plan_opening
        route: chat
        timing: now
        default: {input_tokens: 3500, output_tokens: 200}

  # "AI examples" in the word popup (ADR 0017 §3) and on the back of a review card
  # (ADR 0020): two sentences at the learner's level, once per tenant, word and
  # level; a cached word makes no call.
  word_examples:
    calls:
      - task: word_examples
        timing: now
        default: {input_tokens: 350, output_tokens: 120}

  # Writing them ahead of time (task 44): every 6 hours, for the words a learner will
  # review or learn in the next day that have no Tatoeba sentence, the same call as
  # word_examples, at most vocab.examples_prefetch.per_learner words per learner and
  # within the tenant's daily background budget.
  word_examples_prefetch:
    calls:
      - task: word_examples
        timing: background
        default: {input_tokens: 350, output_tokens: 120}

  # The tutor's diagnosis (P2 plan §6.2): one call over up to 3 weak KCs with their
  # prerequisites, confusables and latest mistakes; daily look for learners due a
  # weekly one, and after a practice set with enough new mistakes (Q46b).
  diagnosis:
    calls:
      - task: diagnose
        timing: background
        default: {input_tokens: 7400, output_tokens: 500}

  # Today's plan on the dashboard (ADR 0027) is drafted by code and calls no model;
  # the tutor's propose_daily_plan tool runs inside a daily conversation turn
  # (chat_message), so it has no entry of its own.

  # "Show in Chinese / English" under a tutor message (ADR 0017 §4): once per message
  # and language; switching back makes no call.
  message_translate:
    calls:
      - task: translate
        timing: now
        default: {input_tokens: 500, output_tokens: 350}

  memory_edit:
    calls:
      - task: memory
        section: embedding
        timing: now
        history: false
        default: {input_tokens: 50, output_tokens: 0}
