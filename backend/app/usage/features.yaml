# Which model calls each learner-facing feature makes (ADR 0014). The frontend's AI
# badge shows these, with token estimates from the tenant's own recent calls
# (`llm_usage`), or the `default` numbers here until there is history.
#
# Adding a feature that calls a model? Register it here and put an AI badge on it.
#
# Per call:
#   task     the `llm_usage.task` label its history is recorded under
#   section  provider section (llm / embedding / asr / tts / pronunciation); default llm
#   route    the route task it runs on, when not the same as `task`
#   timing   now: the learner waits for it; background: after the reply, off the
#            request path. Work nobody waits for (scheduled jobs, generating ahead)
#            also passes `background: True` in the run metadata, so it counts against
#            the tenant's daily background budget (ADR 0025 §5), and gets a learner
#            switch in app/scheduler/prefs.py
#   per      what one call covers: call / image / page (scanned PDF pages only) /
#            minute (realtime calls only: their usage summed over the call's length) /
#            item (one call per item of a set, e.g. each question reviewed on its own)
#   default  estimate without history: input/output tokens, audio_seconds for asr and
#            pronunciation, characters for tts
#   history  false when the call is never recorded in llm_usage (embeddings)

# Successful calls averaged per task.
window: 20

features:
  # Also the desk pet's chat window (ADR 0032 §4a): the same conversation, the same calls;
  # its input box carries this badge.
  chat_message:
    calls:
      # Measured 2026-10-18 (task 100.9, gpt-6.1-sol over Chat Completions): a turn about
      # 4500 tokens in; a reply after tool results 3700, 5300 when it read a skill.
      - task: chat
        timing: now
        default: {input_tokens: 4500, output_tokens: 150}
      # Only when the tutor used a tool: its reply after the tool results (ADR 0015 §7).
      # Opening, closing the workspace and turning its auto-open off are tools too (ADR 0045).
      # So is load_skill (ADR 0055 §6): reading a built-in skill before the tutor writes
      # its own questions adds one such reply, with the skill text in its input.
      - task: chat_tools
        route: chat
        timing: now
        default: {input_tokens: 4200, output_tokens: 150}
      # Only in free chat, for a message of 60+ English words (Q38a): is it a piece of
      # writing for writing_coach? The reply waits for it (ADR 0023 §3).
      - task: route
        timing: now
        default: {input_tokens: 500, output_tokens: 15}
      # Only when route handed the message to writing_coach: the same review as
      # /writing (Q38b); the coach's reply after it is the chat call above.
      - task: writing_review
        timing: now
        default: {input_tokens: 6100, output_tokens: 500}
      # Reflection after each reply: memory, grammar tags, words; every few turns it
      # also rewrites the conversation summary.
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}

  chat_image:
    calls:
      - task: vision
        timing: now
        per: image
        default: {input_tokens: 1500, output_tokens: 200}

  chat_pdf:
    calls:
      - task: vision
        timing: now
        per: page
        default: {input_tokens: 1500, output_tokens: 600}

  chat_audio:
    calls:
      - task: asr
        section: asr
        timing: now
        default: {audio_seconds: 15}

  # Server read-aloud, one sentence per call; repeats come from the cache and cost
  # nothing (ADR 0028 §3). Without a tts route the browser reads aloud: no call, no badge.
  # Counted in characters (qwen3-tts-flash reports characters too). Bailian's qwen-audio
  # also reports tokens, recorded alongside; it makes word pronunciations, not replies
  # (task 64.2b).
  # Also the tutor page's voice preview (ADR 0032): a sample sentence read aloud.
  read_aloud:
    calls:
      - task: tts
        section: tts
        route: default
        timing: now
        default: {characters: 60}

  # A word book's pronunciations, generated ahead of time when the deployment asks
  # (ADR 0028 §4). Per word and accent; not against the daily background budget (Q7).
  # Runs on the tts `words` route when it has a usable model, else `default` (Q64s).
  # On qwen-audio a word also costs ~180 input and ~240 output tokens (task 64.2).
  word_audio_prefetch:
    calls:
      - task: word_audio
        section: tts
        route: default
        timing: background
        default: {characters: 8}

  # Shadowing (ADR 0028 §5): one recording of a sentence, at most 30 s. Scored by
  # pronunciation assessment when configured (`shadowing`), else compared with a
  # transcript (`shadowing_rough`); the UI badges whichever `/speech/capabilities`
  # reports. An assessment that fails falls back to a transcript, a second call.
  shadowing:
    calls:
      - task: pronunciation
        section: pronunciation
        route: default
        timing: now
        default: {audio_seconds: 5}

  shadowing_rough:
    calls:
      - task: shadowing_asr
        section: asr
        route: default
        timing: now
        default: {audio_seconds: 5}

  # Speaking practice (ADR 0029): speaking_coach opens a session (Q58e), then each
  # spoken turn is transcribed (`chat_audio`'s call) and answered; reflection follows
  # as in any chat. Its replies are read aloud by `read_aloud`, badged there.
  speaking_start:
    calls:
      - task: speaking_opening
        route: chat
        timing: now
        default: {input_tokens: 1500, output_tokens: 60}

  speaking_turn:
    calls:
      - task: asr
        section: asr
        timing: now
        default: {audio_seconds: 8}
      # Measured 700 / 42 on qwen-plus early in a conversation (task 64.2); it grows
      # with the conversation, hence the margin.
      - task: speaking
        route: chat
        timing: now
        default: {input_tokens: 1500, output_tokens: 80}
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}

  # A realtime voice call (ADR 0030), per minute from connecting to hanging up. The
  # vendor reports usage per reply; audio is counted as tokens on both sides, and each
  # reply reads the whole call so far again (most of it cached), so input grows with the
  # call's length. Audio tokens cost far more than text ones: a minute here costs several
  # times a minute of speaking_turn (transcription plus a text reply), which is why
  # calls have per-call and per-day limits (Q60g). Transcripts, reflection and the
  # summary after hanging up come with task 61. With a scenario, connecting first looks
  # up the related memories (Q60e): one embedding of its title and goal.
  # Measured (task 64.2, qwen3.5-omni-flash-realtime, a 2-minute call): ~6,500 in and
  # ~370 out a minute; other vendors not measured, so a margin on top.
  realtime_call:
    calls:
      - task: realtime
        section: realtime
        timing: now
        per: minute
        default: {input_tokens: 8000, output_tokens: 400}
      - task: memory
        section: embedding
        timing: now
        history: false
        default: {input_tokens: 20, output_tokens: 0}
      # After hanging up (task 61.3): reflection over the transcript, and the speaking
      # summary when the learner said something and the call lasted 30 s or more (Q61g).
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}
      - task: speaking_summary
        timing: background
        default: {input_tokens: 2500, output_tokens: 600}

  # Ending a session (or opening the speaking page after one was left idle, Q58c): one
  # structured call over the whole conversation.
  speaking_summary:
    calls:
      - task: speaking_summary
        timing: now
        default: {input_tokens: 2500, output_tokens: 600}

  practice_start:
    calls:
      - task: practice_opening
        route: chat
        timing: now
        default: {input_tokens: 1500, output_tokens: 150}

  # A practice set (ADR 0021 §3): one call writes the set's items, one reviews them;
  # items the critic rejects are rewritten and reviewed again, at most
  # practice.max_regenerations more rounds (fewer items each). After a set is done,
  # the next one is written the same way in the background (Q33e).
  practice_set:
    calls:
      # One streamed call writes the set; each question is reviewed on its own as soon
      # as it is written (ADR 0048). Measured 2026-10-18 (task 100.9, gpt-6.1-sol, 7 sets):
      # writing about 5600 tokens in (with the exercise-writing parts), 1100 out; a
      # review 1500 in, 200 out. Task 107 (2026-10-19): the writing guide grew to about
      # 6000 in; reviews rate levels without reasons, 1400 in, about 100 out at reasoning
      # low (150 kept for models thinking at their default). Task 109 (2026-10-19): more
      # failure examples in the guide, about 7000 in.
      - task: exercise_generate
        timing: now
        default: {input_tokens: 7000, output_tokens: 1100}
      - task: exercise_critic
        timing: now
        per: item
        default: {input_tokens: 1400, output_tokens: 150}
      - task: exercise_generate
        timing: background
        default: {input_tokens: 7000, output_tokens: 1100}
      - task: exercise_critic
        timing: background
        per: item
        default: {input_tokens: 1400, output_tokens: 150}

  # Grading an answer the code cannot (ADR 0021 §6): open formats, and find_fix with a
  # fix not in the item's list. One call per such answer, only the first time an item
  # is answered (Q34b); choice and cloze answers are graded by code. Most of the input
  # is the grammar catalog, the same on every call.
  practice_grade:
    calls:
      - task: exercise_grade
        timing: now
        default: {input_tokens: 11900, output_tokens: 150}

  # A quiz card in the chat (ADR 0044 §4): the tutor's give_quiz writes a set on one
  # grammar point the way practice does, a pass quiz of course.quiz_items items or an
  # understanding check of a few; nothing is generated ahead after it. Open answers
  # and explanations are graded on exercise_grade (once per item). The chat call that
  # chose the tool is chat_message's. The tutor may also give an understanding check on
  # its own (ADR 0046 §3), unless the learner turned that off in the tutor settings.
  quiz_card:
    calls:
      # As practice_set (ADR 0048). Measured 2026-10-18 (task 100.9, gpt-6.1-sol, 3 pass
      # quizzes of 5 questions): writing 4900 tokens in (5100 since task 107, 6400 since
      # task 109), 850 out; a review as practice_set.
      - task: exercise_generate
        timing: now
        default: {input_tokens: 6400, output_tokens: 850}
      - task: exercise_critic
        timing: now
        per: item
        default: {input_tokens: 1400, output_tokens: 150}
      - task: exercise_grade
        timing: now
        default: {input_tokens: 11900, output_tokens: 150}

  # Opening an article on /reading (ADR 0024 §5, Q42f): when no version at the
  # learner's level is cached for the tenant, one call rewrites it and writes the
  # comprehension questions, one reviews the questions (on the exercise_critic route);
  # rejected questions are rewritten and reviewed once more (fewer each). A cached
  # version makes no call.
  reading_rewrite:
    calls:
      - task: article_rewrite
        timing: now
        default: {input_tokens: 6000, output_tokens: 1100}
      - task: reading_critic
        route: exercise_critic
        timing: now
        default: {input_tokens: 5400, output_tokens: 350}
      - task: reading_questions
        route: article_rewrite
        timing: now
        default: {input_tokens: 5400, output_tokens: 300}

  # "Ask the tutor" on the reading page (Q43h): reading_coach answers each message with
  # the article in its prompt (Q43i), so a reply reads more than a chat turn does.
  reading_coach:
    calls:
      - task: reading_coach
        route: chat
        timing: now
        default: {input_tokens: 4500, output_tokens: 300}
      - task: reflect
        timing: background
        default: {input_tokens: 13000, output_tokens: 200}
      - task: memory
        section: embedding
        timing: background
        history: false
        default: {input_tokens: 50, output_tokens: 0}

  # Rewriting new articles ahead of time (Q42g): every 2 hours, the newest articles
  # of the feeds a learner follows are rewritten for their level, the same calls as
  # reading_rewrite, within the tenant's daily background budget.
  reading_prerewrite:
    calls:
      - task: article_rewrite
        timing: background
        default: {input_tokens: 6000, output_tokens: 1100}
      - task: reading_critic
        route: exercise_critic
        timing: background
        default: {input_tokens: 5400, output_tokens: 350}
      - task: reading_questions
        route: article_rewrite
        timing: background
        default: {input_tokens: 5400, output_tokens: 300}

  # "Submit" on /writing (P2 plan §4.2): one review of the whole text, run in the
  # background while the page waits for it (Q38c). "Review" on a writing document in
  # the chat workspace (ADR 0043 §5) is the same submission.
  writing_submit:
    calls:
      - task: writing_review
        timing: now
        default: {input_tokens: 6100, output_tokens: 500}

  # "Talk it over with the tutor" in the placement result's conversation (ADR 0015 §6,
  # 0016 §4): the tutor's opening of the planning conversation; later turns, and the
  # dashboard's daily conversation (which has no opening), are chat_message.
  plan_start:
    calls:
      - task: plan_opening
        route: chat
        timing: now
        default: {input_tokens: 3500, output_tokens: 200}

  # Starting a lesson of the grammar course (ADR 0044 §5), from the course page, the
  # lesson bar's next lesson or a lesson card (ADR 0054 §1): the tutor speaks first, then
  # usually calls give_quiz for an understanding check (quiz_card); each turn after is
  # chat_message's, with the lesson's material in the prompt.
  lesson_start:
    calls:
      - task: lesson_opening
        route: chat
        timing: now
        default: {input_tokens: 5000, output_tokens: 300}

  # The desk pet opened for the first time in the day (ADR 0041): the tutor opens
  # today's conversation with a look back at the last 7 days and one or two
  # suggestions. Marked by the pet's AI hair clip; later turns are chat_message.
  pet_daily_opening:
    calls:
      - task: daily_opening
        route: chat
        timing: now
        default: {input_tokens: 4000, output_tokens: 250}

  # "AI examples" in the word popup (ADR 0017 §3) and on the back of a review card
  # (ADR 0020): two sentences at the learner's level, once per tenant, word and
  # level; a cached word makes no call.
  word_examples:
    calls:
      - task: word_examples
        timing: now
        default: {input_tokens: 350, output_tokens: 120}

  # Writing them ahead of time (task 44): every 6 hours, for the words a learner will
  # review or learn in the next day that have no Tatoeba sentence, the same call as
  # word_examples, at most vocab.examples_prefetch.per_learner words per learner and
  # within the tenant's daily background budget.
  word_examples_prefetch:
    calls:
      - task: word_examples
        timing: background
        default: {input_tokens: 350, output_tokens: 120}

  # The tutor's diagnosis (P2 plan §6.2): one call over up to 3 weak KCs with their
  # prerequisites, confusables and latest mistakes; daily look for learners due a
  # weekly one, and after a practice set with enough new mistakes (Q46b).
  diagnosis:
    calls:
      - task: diagnose
        timing: background
        default: {input_tokens: 7400, output_tokens: 500}

  # Today's plan on the dashboard (ADR 0027) is drafted by code and calls no model;
  # the tutor's propose_daily_plan tool runs inside a daily conversation turn
  # (chat_message), so it has no entry of its own.

  # "Show in Chinese / English" under a tutor message (ADR 0017 §4): once per message
  # and language; switching back makes no call.
  message_translate:
    calls:
      - task: translate
        timing: now
        default: {input_tokens: 500, output_tokens: 350}

  # The reading view of the chat workspace (ADR 0043 §4): "Translation" shows each
  # paragraph's translation as it scrolls into view, and in the original a paragraph's
  # button translates that one; one call per paragraph, kept with the document, so
  # switching displays or reopening makes no call.
  workspace_translate:
    calls:
      - task: translate
        timing: now
        default: {input_tokens: 300, output_tokens: 250}

  # Tapping a sentence in the workspace's reading view (ADR 0043 §4): its structure
  # explained, once per sentence; on the default route unless the tenant routes it.
  workspace_analyze:
    calls:
      - task: sentence_analysis
        timing: now
        default: {input_tokens: 400, output_tokens: 300}

  memory_edit:
    calls:
      - task: memory
        section: embedding
        timing: now
        history: false
        default: {input_tokens: 50, output_tokens: 0}
