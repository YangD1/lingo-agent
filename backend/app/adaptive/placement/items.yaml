# Placement grammar item bank (ADR 0010 §4, ADR 0012 §3, P1 plan §6.1).
#
# Four-option gap-fill items, one grammar KC each. Drafted by a model and reviewed
# item by item against the standard at the end of this header before commit.
#
# Ids are permanent (p.<kc name>.<n>): answer statistics hang off them. Fix a typo
# freely, but an item whose meaning changes gets a new id.
#
# Difficulty is not written here. Each item rates the four rubric dimensions in
# rules.yaml (difficulty.dimensions) with a reason; the loader computes
# difficulty = cefr_anchor[KC level] + sum of offsets. Options are shuffled at run time.
#
# Review standard: exactly one option is correct in any reasonable reading, the
# distractors are wrong in standard English (not merely less natural), the item
# tests the KC it names and nothing harder, and it needs no cultural knowledge.

format: choice4
items:
- id: p.be_present.1
  kc: g.be_present
  stem: My parents ___ both teachers.
  answer: are
  distractors:
  - is
  - am
  - be
  rubric:
    vocabulary:
      level: at_target
      reason: Everyday A1 words.
    syntax:
      level: simple
      reason: One short clause.
    cues:
      level: explicit
      reason: Plural subject 'my parents' points to are.
    distractors:
      level: one_plausible
      reason: Only 'is' tempts; am and be are clearly wrong.
