# Adaptive-engine rules (ADR 0012). Every number the mastery and difficulty
# algorithms use lives here, so a rule change is a YAML edit, not a code change.
#
# Bump `version` on ANY change: kc_mastery rows record the version they were computed
# with, and rows from an older version are rebuilt by replaying kc_evidence.

version: "2026-10-10.3"

bkt:
  # Chance of moving from "not learned" to "learned" at each counted observation.
  p_learn: 0.1
  # Chance of getting it wrong while knowing it.
  p_slip: 0.1
  # Chance of getting it right without knowing it. Production (using a structure
  # correctly in free speech or writing) is much harder to fake than recognition
  # (picking the right option in a test item).
  p_guess:
    recognition: 0.2
    production: 0.05
  # p_mastery at or above this counts as mastered.
  mastered: 0.95
  # p_mastery below this counts as weak (learner page, dashboard); display only,
  # BKT itself does not use it.
  weak: 0.4
  # Initial p_mastery when the learner's CEFR level is known, by
  # gap = learner level - KC level (in levels). Keys must be consecutive integers;
  # gaps beyond either end use the nearest key.
  prior_by_gap:
    2: 0.9
    1: 0.7
    0: 0.4
    -1: 0.15
  # Initial p_mastery before placement, by KC level alone.
  prior_unknown_learner:
    A1: 0.6
    A2: 0.5
    B1: 0.35
    B2: 0.25
    C1: 0.15
    C2: 0.1

evidence:
  # Mistakes of other severities are stored but not fed to BKT.
  # low: a slip that does not look systematic; medium: a clear error, meaning intact;
  # high: the error gets in the way of understanding.
  counted_severities: [medium, high]
  # Observations counted per KC per learner turn, so repeating one error in one
  # message is not punished several times. Errors are counted before successes.
  max_per_turn: 1

elo:
  # Ratings are on a logit scale: ability - difficulty = 0 means a 50% chance
  # before guessing. K(n) = alpha / (1 + beta * n), n = answers so far
  # (Pelanek 2016); K(n) also serves as the uncertainty of the estimate.
  learner:
    alpha: 1.0
    beta: 0.05
  item:
    alpha: 0.8
    beta: 0.05
  initial_ability: 0.0
  # Floor on the chance of a correct answer from blind guessing, by item format
  # (every practice format of ADR 0021 needs one). A cloze gap has a hint, so a few
  # forms are plausible; find_fix needs the right piece and the right fix; open
  # formats cannot be guessed.
  guess_by_format:
    choice4: 0.25
    cloze: 0.1
    find_fix: 0.05
    transform: 0.0
    translate: 0.0
    rewrite_own: 0.0

# Prior difficulty of a test or practice item (ADR 0012 §3). The model picks one
# level per dimension; difficulty = cefr_anchor[target KC level] + sum of offsets.
difficulty:
  cefr_anchor:
    A1: -2.5
    A2: -1.5
    B1: -0.5
    B2: 0.5
    C1: 1.5
    C2: 2.5
  dimensions:
    vocabulary:
      description: The hardest words in the item other than the tested structure.
      levels:
        below_target: {offset: -0.3, description: "All words are well below the target level."}
        at_target: {offset: 0.0, description: "Some words are at the target level."}
        above_target: {offset: 0.4, description: "Some words are above the target level."}
    syntax:
      description: Sentence length and embedding around the tested structure.
      levels:
        simple: {offset: -0.2, description: "One short clause."}
        moderate: {offset: 0.0, description: "Two clauses or a longer sentence."}
        complex: {offset: 0.4, description: "Several clauses or heavy embedding."}
    cues:
      description: How much the context signals the answer (e.g. "yesterday" for a past tense).
      levels:
        explicit: {offset: -0.4, description: "A word in the item points straight to the answer."}
        partial: {offset: 0.0, description: "The context helps but needs interpretation."}
        none: {offset: 0.3, description: "Only knowledge of the rule gives the answer."}
    distractors:
      description: How attractive the wrong options are to a learner who lacks the rule.
      levels:
        weak: {offset: -0.4, description: "Wrong options are obviously wrong."}
        one_plausible: {offset: 0.0, description: "One wrong option is tempting."}
        several_plausible: {offset: 0.4, description: "Several wrong options are tempting, e.g. common transfer errors."}

# Vocabulary review (ADR 0011). Words are scheduled by FSRS (py-fsrs, default
# parameters); these are the knobs around it.
vocab:
  # FSRS schedules each review for when the chance of still remembering the word
  # drops to this.
  desired_retention: 0.9
  # New words a day, unless the learner sets their own number.
  daily_new: 15
  # Cards in their first learning steps (minutes apart) that fall due within this
  # many minutes are shown now instead of making the learner wait.
  learn_ahead_minutes: 20
  # A word counts as mastered on the dashboard once FSRS has it in review with at
  # least this many days of stability (Anki's "mature" card); display only.
  mastered_stability_days: 21
  # Known-word screening: the learner marks the words they already know.
  screening:
    batch_size: 50
    # Each batch is spread over the next this-many not-yet-seen words of the book,
    # in frequency order; the next batch starts after them.
    window: 500
    # When at least this share of a batch is known, the next batch also skips one
    # more window, among rarer words.
    skip_ratio: 0.8
  # AI example sentences written ahead of time (task 44), for words with no Tatoeba
  # sentence: the cards due within `ahead_hours` and the next day's new words, at most
  # `per_learner` words per learner per run.
  examples_prefetch:
    ahead_hours: 24
    per_learner: 30

# Placement test (ADR 0010 §4, P1 plan §6).
placement:
  # Vocabulary-size test: "do you know this word?" over real words sampled by
  # contemporary frequency rank (ECDICT frq) and pseudo-words.
  vocab:
    # Real words come from bands of this many ranks, up to max_rank; the estimate
    # counts words up to max_rank only.
    band_size: 1000
    max_rank: 20000
    questions: 40
    # Share of the questions that are pseudo-words.
    pseudo_share: 0.25
    # Chance of knowing a word of rank r: 1 / (1 + (r / V)^steepness), V being the
    # rank at which the learner knows half the words. Higher = sharper drop-off.
    steepness: 3.0
    # Weak prior on V (log-normal), so all-yes or all-no answers give a finite
    # estimate: median and the standard deviation of ln V.
    prior_median: 3000
    prior_log_sd: 1.5
    # When the learner says yes to at least this share of pseudo-words, the result
    # is shown as unreliable.
    unreliable_false_alarm: 0.4
    # Offered after the test: mark the book's words up to the rank the learner knows
    # with at least this probability as known, if they confirm.
    mark_known_p: 0.9
    # Reference CEFR level for the vocabulary part only (the overall level is the
    # grammar level): lowest count of known words among the `basis` most frequent
    # ranks, from Milton (2010), X-Lex over the 5,000 most frequent lemmas, Greek EFL
    # learners. Rough: shown as a reference, never used to place the learner.
    cefr_reference:
      basis: 5000
      thresholds:
        A2: 1500
        B1: 2500
        B2: 3250
        C1: 3750
        C2: 4500
  # Grammar test: four-option items from placement/items.yaml, picked adaptively.
  grammar:
    # Next item: the unanswered one whose predicted chance of a correct answer
    # (guessing included) is nearest this, preferring KCs not yet tested.
    target_p: 0.55
    # Among items within this distance of the best predicted chance, one is drawn at
    # random, so a retest does not repeat the same sequence.
    pick_tolerance: 0.05
    min_items: 8
    max_items: 20
    # Stop early once the ability's standard error drops below this (logits). With
    # four-option items (guessing floor 0.25) 20 answers only get it to about
    # 0.55-0.65, so in practice everyone answers max_items; simulated learners are
    # then placed at their level 52-72% of the time and within one level 93-100%.
    stop_se: 0.55
    # Prior on ability: normal around elo.initial_ability with this spread.
    prior_sd: 1.5
    # Item difficulties are re-estimated after each finished test (ADR 0012 §3); the
    # test uses the re-estimated value only once an item has this many answers, until
    # then its rubric prior.
    calibrated_min_attempts: 30
    # Lowest ability for each level; below A2 is A1. Set near the median difficulty
    # of each level's items: at the cut, a learner has an even chance (before
    # guessing) on a typical item of that level. Tune from real results later.
    cefr_cutpoints:
      A2: -1.8
      B1: -0.8
      B2: 0.4
      C1: 1.2
      C2: 2.4

# Study advice (P1 plan §7.5.2, ADR 0016). The algorithm proposes candidate actions and
# ranks them; the tutor talks them over in the dashboard's daily conversation and the
# planning conversation, and may only offer cards within them.
advice:
  # Candidates the tutor is told about (the dashboard shows the best few as quick replies).
  max_candidates: 6
  # Suggest a retest once the latest finished placement test is this old.
  retest_days: 60
  # Or earlier, once this share of the grammar points at the level the latest test gave
  # is learned (mastery_gate), but not within `retest_min_days` of that test (Q50a).
  retest_learned_share: 0.7
  retest_min_days: 14
  # "Not now" on a test reminder silences the same reason for this many days (Q50c).
  reminder_snooze_days: 14
  # Grammar practice: a KC not yet mastered with a counted mistake in conversation
  # within this many days, at most this many KCs.
  grammar_days: 14
  max_grammar: 2
  # Score = priority x urgency, urgency in (0, 1]. Priority says how much the action
  # matters when it is fully urgent.
  priority:
    placement: 1.0
    choose_book: 0.9
    vocab_review: 0.8
    grammar_practice: 0.7
    vocab_screen: 0.6
    vocab_learn: 0.5
    retest_progress: 0.75
    retest: 0.4
  # Urgency of countable actions is n / (n + half): half-way at `half`, so a few due
  # words matter less than many, without a cliff. Grammar counts mistakes weighted by
  # how far the KC is from mastered (1 - p).
  half:
    vocab_review: 20
    vocab_learn: 5
    grammar_practice: 1.5

# Practice sets (ADR 0021 §2-§4, P2 plan §3.3-§3.4).
practice:
  # Items in one set.
  set_size: 10
  # Share of a set's items on weak KCs; the rest go to mastered or due KCs
  # (interleaving). The same KC never comes twice in a row.
  weak_share: 0.7
  # The same format at most this many times in a row.
  max_same_format_run: 2
  # Items aim at a predicted chance of a correct answer (guessing included) in this
  # range: hard enough to learn from, easy enough to keep going (the "85% rule").
  target_p:
    low: 0.80
    high: 0.85
  # rewrite_own uses the learner's own counted mistakes from conversation, this recent.
  rewrite_own_days: 30
  # Items the critic rejects go back to the generator at most this many times; then
  # they are dropped and the placement item bank fills the gap.
  max_regenerations: 2
  # A set the learner is waiting for (not one generated ahead): another round is
  # started only if, at the pace of the last one, it would end within this many
  # seconds of the start; otherwise the bank fills the open slots at once. A round
  # took about 100 s on a reasoning model (task 49.2): three of them kept the
  # learner waiting five minutes.
  wait_budget_seconds: 150
  # Candidate KCs: those within the levels of `importance_by_gap`, plus any KC with
  # evidence. Learners without a placement level count as this level.
  default_level: A2
  # How much a weak KC matters by gap = learner level - KC level (in levels), as in
  # bkt.prior_by_gap: the learner's own level first, then just below (gaps to fill),
  # then one above (next to learn), then two below. Keys must be consecutive
  # integers; KCs with evidence outside the range use the nearest key.
  importance_by_gap:
    2: 0.5
    1: 0.8
    0: 1.0
    -1: 0.7
  # Counted mistakes on a KC in the last `recent_mistake_days` raise its priority by
  # a factor of 1 + n / (n + mistake_half): half the full boost at `mistake_half`.
  recent_mistake_days: 30
  mistake_half: 2.0
  # Items on one KC in one set: enough to vary the format, not a drill.
  max_items_per_kc: 3
  # Below this p_mastery a KC gets recognition formats (choice4, cloze, find_fix)
  # first; at or above it, production formats (transform, translate, rewrite_own).
  production_from_p: 0.4
  # The generator and the critic each rate an item on the difficulty rubric; ratings
  # this far apart (in logits) mean they disagree about the item, and it is rejected
  # (Q33a). The critic's rating is the one kept.
  critic_max_gap: 0.7
  # Bank items fill slots the generator could not (Q33c): first items the learner has
  # not seen, then ones last seen at least this many days ago.
  bank_repeat_days: 14
  # A set with fewer items than this, even after the bank, fails (Q33c, Q33d).
  min_items: 5
  # A set generated ahead of time is used only while younger than this and planned
  # under the current rules (Q33e).
  prefetch_max_hours: 24

# When a grammar KC counts as learned (ADR 0021 §7). All conditions hold at one
# piece of evidence, judged only from evidence up to it, so replaying gives the same
# answer. From then on the KC's practice answers are scheduled by FSRS.
mastery_gate:
  # Besides p_mastery >= bkt.mastered: correct answers in at least this many formats.
  min_formats: 3
  # ...with at least this many hours between the first and the last correct answer
  # ("on two days", without needing the learner's time zone).
  min_span_hours: 20
  # ...and no counted mistake on the KC in conversation or writing in the days before.
  clean_days: 14

# Graded reading (ADR 0024 §5, P2 plan §5.3). A version of an article is written for
# one level and cached per tenant, article and level.
reading:
  # Levels an article is rewritten for; a learner above the last one reads the
  # original (Q42a). Learners without a placement level count as practice.default_level.
  levels: [A1, A2, B1, B2, C1]
  # Words of the original sent to the model, at most; a longer article is cut at a
  # paragraph boundary (Q42b).
  max_source_words: 3000
  # Length of the rewrite by level, in words. Outside this range by more than
  # `length_slack` the rewrite is tried once more, then fails.
  words:
    A1: {min: 150, max: 250}
    A2: {min: 250, max: 400}
    B1: {min: 400, max: 600}
    B2: {min: 600, max: 850}
    C1: {min: 800, max: 1100}
  length_slack: 0.25
  # Comprehension questions asked for with the rewrite; rejected ones are rewritten
  # at most `max_regenerations` times, then dropped (Q42d).
  questions: 5
  max_regenerations: 1
  # Glossary (Q42c): words of the rewrite whose frequency rank in the lexicon is past
  # the level's cut, at most `glossary_max`, in order of first use.
  glossary_rank:
    A1: 1000
    A2: 2000
    B1: 3500
    B2: 6000
    C1: 9000
  glossary_max: 15
  # Background rewriting (Q42g): per feed and level a subscriber reads at, the newest
  # this many articles published in the last `prerewrite_days` days.
  prerewrite_per_feed: 2
  prerewrite_days: 3

# Grammar graph queries (ADR 0022 §3): what diagnosing a weak KC looks at around it.
graph:
  # How many prerequisite levels to walk up from the KC (1 = direct prerequisites).
  prerequisite_depth: 3
  # Latest mistakes shown per KC (the KC itself, its prerequisites and confusables).
  mistakes_per_kc: 3

# The tutor's diagnosis (P2 plan §6.2, Q46a-e): root-cause hypotheses over a KC's
# prerequisite chain and confusables, written by a model, checked by code.
diagnosis:
  # KCs looked at: not learned, with at least `min_mistakes` counted mistakes (any
  # source but placement) in the last `mistake_days` days; the `max_kcs` with the
  # highest practice priority, in one call. None qualifies: no call.
  max_kcs: 3
  min_mistakes: 3
  mistake_days: 30
  # Weekly: a learner is diagnosed again this many days after the last diagnosis,
  # if counted mistakes came since.
  interval_days: 7
  # After a practice set: at least this many hours since the last diagnosis (as
  # mastery_gate.min_span_hours: "another day") and this many counted mistakes since.
  after_set_min_hours: 20
  after_set_min_mistakes: 3
  # A hypothesis is kept only with at least this many valid evidence citations (one
  # mistake is no pattern); at most `max_hypotheses` are kept.
  min_evidence: 2
  max_hypotheses: 3
  # Practice priority of the KCs a diagnosis names is multiplied by `boost`, for
  # `boost_days` after it, until the KC is learned. The model's confidence is shown,
  # never used here.
  boost: 1.5
  boost_days: 14

# The daily plan (P2 plan §7, ADR 0027): drafted by code from the learner's daily
# minutes, adjusted on the card or through the tutor, never scored by a model.
daily_plan:
  # Minutes a day when the profile has none.
  default_minutes: 20
  # Estimated minutes per review, per new word, and per practice set / article / essay.
  minutes:
    review: 0.25
    new_word: 1.0
    practice: 8
    reading: 10
    writing: 15
    # A speaking practice, as the plan counts it (Q59d).
    speaking: 10
  # Reviews first take at most this share of the minutes, so a backlog does not crowd
  # out everything else; time left over at the end goes back to the backlog.
  review_share: 0.6
  # Writing only on days with at least this many minutes, and not within this many
  # days of the last essay.
  writing_min_minutes: 45
  writing_gap_days: 7
  # Upper bound for a count the learner or the tutor sets.
  max_count: 500
  # Speaking is done once the learner's own voice turns add up to this many minutes
  # today (Q59d): in a half-duplex practice the tutor talks, and transcribing and
  # thinking take time too, so a 10-minute practice has about 5 minutes of the
  # learner speaking.
  speaking_target_minutes: 5

# Shadowing scored by pronunciation assessment (ADR 0028 §6, Q56b-c). A rough result
# compared from a transcript is never evidence.
pronunciation:
  # Speaking ability takes one Elo step per counted attempt, with the overall score
  # (0-100) / 100 as the outcome (82 counts as 0.82 of a correct answer).
  # Sentence difficulty = cefr_anchor[level of its rarest lexicon word] + the offset of
  # the first length band that fits. A word's level is the first whose frequency rank
  # cut it is within; past every cut it is C2. Words outside the lexicon (names) are
  # left out; a sentence with none counts as A1.
  level_rank:
    A1: 1000
    A2: 2000
    B1: 3500
    B2: 6000
    C1: 9000
  length_offsets:
    - {max_words: 5, offset: -0.3}
    - {max_words: 12, offset: 0.0}
    - {max_words: 1000, offset: 0.3}
  # Not counted toward speaking ability: barely read, too few words, or too short a
  # recording to say anything.
  min_completeness: 50
  min_words: 3
  min_seconds: 1.0
  # A word read with accuracy below this is marked "you don't say this one right" on
  # its review card; a later reading at or above it clears the mark.
  word_threshold: 60

# Speaking practice (ADR 0029).
speaking:
  # speaking_coach's replies are spoken aloud: at most this many sentences, by the
  # learner's level (ADR 0029 §2).
  max_sentences:
    A1: 2
    A2: 2
    B1: 3
    B2: 3
    C1: 4
    C2: 4
  # A spoken turn with fewer words than this gives no mistake evidence: a short
  # transcript is too easily wrong (Q58a). Typed turns are not filtered.
  min_words_for_mistakes: 3
  # The summary rates how easy the learner was to understand; speaking ability takes one
  # Elo step with this outcome (Q58d), against cefr_anchor of the learner's level kept
  # within the scenario's range (free talk: the learner's level).
  intelligibility_outcome:
    hard: 0.25
    partly: 0.5
    mostly: 0.75
    fully: 1.0
  # Fewer spoken turns than this: the summary is made but ability does not move.
  min_spoken_turns: 4
  # A session left this long without a turn is summed up when the learner next opens
  # it or the speaking page (Q58c).
  idle_minutes: 30
