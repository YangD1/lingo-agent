[project]
name = "lingo-agent-backend"
version = "0.1.0"
description = "lingo-agent backend: FastAPI + LangGraph AI English tutor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "anyio>=4.15,<5",
    "cryptography>=46,<50",
    "email-validator>=2,<3",
    "fastapi>=0.141,<1",
    "httpcore2>=2.13,<3",
    "httpx2>=2.13,<3",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "langchain-core>=1.6,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "openinference-instrumentation-langchain>=0.1.76,<0.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "pillow>=12,<13",
    "psycopg[binary,pool]>=3.3,<4",
    "pwdlib[argon2]>=0.3,<0.4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15,<3",
    "python-multipart>=0.0.20",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
