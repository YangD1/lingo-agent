# Checks every push and pull request (P0 plan §10). No secrets and no real model API:
# tests use fake models, and the database is a throwaway service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Postgres: the same image as docker-compose.yml, on host port 5433 like there, so the
# tests' and e2e's default connection settings work unchanged.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lingo
          POSTGRES_PASSWORD: lingo
          # Locally docker/postgres/init creates it; service containers can't mount the repo.
          POSTGRES_DB: lingo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lingo -d lingo_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 该 action 从 v8 起不再发布浮动的主版本标签
        with:
          version: "0.11.8" # same as backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # Migrations are covered here: the test session downgrades to base and upgrades to
      # head on the empty database before any test runs.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Only checks that the images build (nothing is pushed or deployed). Build args
      # default to what docker-compose.yml passes.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lingo
          POSTGRES_PASSWORD: lingo
          POSTGRES_DB: lingo # e2e/run_backend.py creates lingo_e2e itself
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lingo -d lingo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # 该 action 从 v8 起不再发布浮动的主版本标签
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The fake model and the backend run with `uv run --project ../backend`.
      - run: uv sync --locked
        working-directory: backend
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts starts the fake model, the backend and a production build of
      # the frontend itself; CI=true means fresh servers, one retry, GitHub annotations.
      - run: pnpm e2e
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
