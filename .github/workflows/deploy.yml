# Continuous deployment (docs/deploy.md, ADR 0063): pushing a v* tag tests that commit,
# pushes its images to the registry and has the server switch to it over SSH. To go
# back to an earlier version, run this workflow by hand from that version's tag; its
# images are still in the registry, so it skips straight to the deploy.
#
# The repository is public and so are these logs: secrets stay in the `production`
# environment (usable from v* tags only), third-party actions are pinned to commits,
# and the server prints steps and outcomes only. The SSH key can run nothing but
# "deploy <commit>" (deploy/deploy-entry).
#
# production environment
#   variables: ACR_REGISTRY (registry host for pushing), ACR_NAMESPACE, DEPLOY_USER
#   secrets:   ACR_USERNAME, ACR_PASSWORD, DEPLOY_HOST, DEPLOY_PORT,
#              DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (the server's host key line)
# DEPLOY_USER is a variable: logs replace every occurrence of a secret's value with ***,
# and a user named "deploy" would blank out that word everywhere.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # pgvector/pgvector:pg16, pinned so the database image only changes on purpose.
  PGVECTOR_SOURCE: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a

jobs:
  # Are this commit's images already in the registry (a redeploy or rollback)?
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      pushed: ${{ steps.registry.outputs.pushed }}
    steps:
      - name: Log in to the registry
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
      - id: registry
        env:
          PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}
        run: |
          pushed=true
          for repo in backend frontend release; do
            docker manifest inspect "$PREFIX/$repo:$GITHUB_SHA" >/dev/null 2>&1 || pushed=false
          done
          echo "pushed=$pushed" >>"$GITHUB_OUTPUT"
          echo "images already pushed: $pushed"

  ci:
    needs: check
    if: needs.check.outputs.pushed != 'true'
    uses: ./.github/workflows/ci.yml

  images:
    needs: [check, ci]
    if: needs.check.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
      # Tagged with the commit (what the server deploys) and the version tag (for people).
      - name: Backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          provenance: false
          tags: |
            ${{ env.PREFIX }}/backend:${{ github.sha }}
            ${{ env.PREFIX }}/backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          provenance: false
          tags: |
            ${{ env.PREFIX }}/frontend:${{ github.sha }}
            ${{ env.PREFIX }}/frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
      - name: Release image (compose file, config/, deploy/)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/release.Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.PREFIX }}/release:${{ github.sha }}
            ${{ env.PREFIX }}/release:${{ github.ref_name }}
      # The server can't reach Docker Hub without a proxy; it pulls this copy instead.
      - name: Mirror pgvector
        run: docker buildx imagetools create --tag "$PREFIX/pgvector:pg16" "$PGVECTOR_SOURCE"

  deploy:
    needs: [check, images]
    # After a fresh build, or straight away when the images were already pushed. Not
    # when CI failed: then `images` is skipped too, so "skipped" alone means nothing.
    if: >-
      always() && needs.check.result == 'success'
      && (needs.images.result == 'success' || needs.check.outputs.pushed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
