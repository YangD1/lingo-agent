# Provider presets and default routes for local development. Selected via PROVIDERS_CONFIG.
# Semantics: docs/decisions/0002-provider-layer.md and 0004-tenant-credentials.md
#
# No API keys here: each tenant adds connections (vendor + base_url + key) in the app.
# A connection created from a preset gets the preset's name, so default routes
# ("<name>:<model>") work as soon as the tenant adds the key. Routes skip connections
# the tenant hasn't created; tenants can also override any task's route.

presets:
  deepseek:
    kind: deepseek
    label: DeepSeek
    base_url: https://api.deepseek.com/v1
    models: [deepseek-chat, deepseek-reasoner]
  anthropic:
    kind: anthropic
    label: Anthropic Claude
    base_url: https://api.anthropic.com
    models: [claude-sonnet-5, claude-haiku-4-5]
  openai:
    kind: openai
    label: OpenAI
    base_url: https://api.openai.com/v1
    models: [gpt-5-mini, text-embedding-3-small, gpt-transcribe, gpt-4o-mini-tts]
  qwen:
    kind: openai_compatible
    label: Qwen (DashScope)
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models: [qwen-plus]
  ollama:
    kind: openai_compatible
    label: Ollama (local; needs PROVIDER_ALLOW_PRIVATE_NETWORKS=true)
    base_url: http://localhost:11434/v1
    models: [qwen3]
  groq:
    kind: openai_compatible
    label: Groq (speech-to-text)
    base_url: https://api.groq.com/openai/v1
    models: [whisper-large-v3-turbo]
  # Groq refuses requests from some regions (mainland China included, 403); this one is
  # reachable there. SenseVoice also handles Chinese, Cantonese, Japanese and Korean.
  siliconflow:
    kind: openai_compatible
    label: SiliconFlow (speech-to-text, read aloud)
    base_url: https://api.siliconflow.cn/v1
    models: [FunAudioLLM/SenseVoiceSmall, FunAudioLLM/CosyVoice2-0.5B]
  # Text-to-speech and pronunciation assessment (ADR 0028). For reading aloud the model
  # is the voice; for pronunciation assessment the model is `pronunciation`. The base URL
  # names the region: https://<region>.tts.speech.microsoft.com, or
  # https://<region>.tts.speech.azure.cn for Azure in China.
  azure:
    kind: azure_speech
    label: Azure Speech (read aloud, pronunciation)
    base_url: https://eastasia.tts.speech.microsoft.com
    models: [en-US-AvaMultilingualNeural, en-GB-SoniaNeural, zh-CN-XiaoxiaoMultilingualNeural, pronunciation]
  speaches:
    kind: openai_compatible
    label: Speaches (local speech-to-text and read aloud; compose profile `asr`, needs PROVIDER_ALLOW_PRIVATE_NETWORKS=true)
    base_url: http://localhost:8200/v1
    base_url_env: SPEACHES_BASE_URL   # docker-compose.yml sets http://asr:8000/v1 for its backend
    models: [Systran/faster-whisper-small, speaches-ai/Kokoro-82M-v1.0-ONNX]

defaults:
  timeout: 30
  max_retries: 1        # fail over to the next model fast instead of retrying one

llm:
  default: [deepseek:deepseek-chat, anthropic:claude-sonnet-5, openai:gpt-5-mini]
  routes:
    chat:
      models: [deepseek:deepseek-chat, anthropic:claude-sonnet-5, openai:gpt-5-mini]
      temperature: 0.7
    # Reads images and answers the turn they were sent with (ADR 0008 §5). Only models
    # known to accept images: this task never falls back to the default route.
    vision:
      models: [anthropic:claude-sonnet-5, openai:gpt-5-mini]
    # Practice items (ADR 0021 §3). The critic checks the generator's items, so by
    # default it starts on another vendor's model: the same model tends to miss its
    # own mistakes. Low temperature: a reviewer, not a writer.
    exercise_critic:
      models: [anthropic:claude-sonnet-5, openai:gpt-5-mini, deepseek:deepseek-chat]
      temperature: 0
    # Free chat: is a long message a piece of the learner's writing, for writing_coach
    # (ADR 0023 §3)? A short classification the reply waits for: cheap models first.
    route:
      models: [deepseek:deepseek-chat, openai:gpt-5-mini, anthropic:claude-sonnet-5]
      temperature: 0
    # The tutor's diagnosis (P2 plan §6.2): reasoning over the learner's evidence in the
    # background, checked by code afterwards. Low temperature: an analyst, not a writer.
    diagnose:
      models: [deepseek:deepseek-chat, anthropic:claude-sonnet-5, openai:gpt-5-mini]
      temperature: 0.2
  # Per task, whatever its route (task 49.3): structured calls that write or review
  # a whole set, article or essay took 25-85 s on a reasoning model (gpt-6.1-sol,
  # 2026-10-09), past the 30 s default. A tenant's connection timeout still wins.
  task_params:
    exercise_generate: {timeout: 120}
    exercise_critic: {timeout: 120}
    article_rewrite: {timeout: 120}
    reading_questions: {timeout: 120}
    reading_critic: {timeout: 120}
    writing_review: {timeout: 120}
    diagnose: {timeout: 120}
    exercise_grade: {timeout: 60}
    reflect: {timeout: 60}
    speaking_summary: {timeout: 60}

embedding:
  default: openai:text-embedding-3-small

# Speech-to-text over OpenAI's /audio/transcriptions (ADR 0008 §5); fallbacks allowed.
asr:
  default: [groq:whisper-large-v3-turbo, siliconflow:FunAudioLLM/SenseVoiceSmall, openai:gpt-transcribe]

# Read aloud on the server (ADR 0028 §3); optional: without it the browser reads aloud.
# Voices come from the model (Azure) or built-in defaults, overridable per model with
# `voices: {"<connection>:<model>": {en-US: ..., en-GB: ..., zh-CN: ...}}`.
tts:
  default: [azure:en-US-AvaMultilingualNeural, siliconflow:FunAudioLLM/CosyVoice2-0.5B, openai:gpt-4o-mini-tts, speaches:speaches-ai/Kokoro-82M-v1.0-ONNX]

# Pronunciation assessment for shadowing (ADR 0028 §5); optional: without it shadowing
# compares a speech-to-text transcript with the sentence instead (no scores).
pronunciation:
  default: [azure:pronunciation]
