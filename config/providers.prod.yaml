# Provider presets and default routes for production. Selected via PROVIDERS_CONFIG.
# Semantics: docs/decisions/0002-provider-layer.md and 0004-tenant-credentials.md
# No API keys here: tenants configure their own connections in the app.

presets:
  deepseek:
    kind: deepseek
    label: DeepSeek
    base_url: https://api.deepseek.com/v1
    models: [deepseek-chat, deepseek-reasoner]
  anthropic:
    kind: anthropic
    label: Anthropic Claude
    base_url: https://api.anthropic.com
    models: [claude-sonnet-5, claude-haiku-4-5]
  openai:
    kind: openai
    label: OpenAI
    base_url: https://api.openai.com/v1
    models: [gpt-5-mini, text-embedding-3-small, gpt-transcribe]
  qwen:
    kind: openai_compatible
    label: Qwen (DashScope)
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models: [qwen-plus]
  groq:
    kind: openai_compatible
    label: Groq (speech-to-text)
    base_url: https://api.groq.com/openai/v1
    models: [whisper-large-v3-turbo]
  # Groq refuses requests from some regions (mainland China included, 403); this one is
  # reachable there. SenseVoice also handles Chinese, Cantonese, Japanese and Korean.
  siliconflow:
    kind: openai_compatible
    label: SiliconFlow (speech-to-text)
    base_url: https://api.siliconflow.cn/v1
    models: [FunAudioLLM/SenseVoiceSmall]

defaults:
  timeout: 30
  max_retries: 1

llm:
  default: [deepseek:deepseek-chat, qwen:qwen-plus, openai:gpt-5-mini]
  routes:
    chat:
      models: [deepseek:deepseek-chat, anthropic:claude-sonnet-5, qwen:qwen-plus]
      temperature: 0.7
    # Reads images and answers the turn they were sent with (ADR 0008 §5). Only models
    # known to accept images: this task never falls back to the default route.
    vision:
      models: [anthropic:claude-sonnet-5, openai:gpt-5-mini]
    # Practice items (ADR 0021 §3). The critic checks the generator's items, so by
    # default it starts on another vendor's model: the same model tends to miss its
    # own mistakes. Low temperature: a reviewer, not a writer.
    exercise_critic:
      models: [qwen:qwen-plus, openai:gpt-5-mini, deepseek:deepseek-chat]
      temperature: 0
    # Free chat: is a long message a piece of the learner's writing, for writing_coach
    # (ADR 0023 §3)? A short classification the reply waits for: cheap models first.
    route:
      models: [deepseek:deepseek-chat, qwen:qwen-plus, openai:gpt-5-mini]
      temperature: 0
    # The tutor's diagnosis (P2 plan §6.2): reasoning over the learner's evidence in the
    # background, checked by code afterwards. Low temperature: an analyst, not a writer.
    diagnose:
      models: [deepseek:deepseek-chat, qwen:qwen-plus, openai:gpt-5-mini]
      temperature: 0.2

embedding:
  default: openai:text-embedding-3-small

# Speech-to-text over OpenAI's /audio/transcriptions (ADR 0008 §5); fallbacks allowed.
asr:
  default: [groq:whisper-large-v3-turbo, siliconflow:FunAudioLLM/SenseVoiceSmall, openai:gpt-transcribe]
